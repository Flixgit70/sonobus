name: Beta release SonoBus and Streamer

on:
  push:
    tags:
      - 'v*-beta*'
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build and publish only the Windows VST3 products
        required: false
        type: boolean
        default: false
      release_tag:
        description: Existing beta tag to receive the Windows assets (optional)
        required: false
        type: string

permissions:
  contents: write

jobs:
  macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Apple Silicon build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUniversalBinary=OFF -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build macOS products
        run: cmake --build build --config Release --target SonoBus_VST3 SonoBus_Standalone SonoBusStreamer_VST3 SonoBusStreamer_Standalone --parallel 4

      - name: Package macOS products
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/SonoBus_artefacts/Release/VST3/SonoBus.vst3" "SonoBus-macOS-ARM64-VST3.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/SonoBus_artefacts/Release/Standalone/SonoBus.app" "SonoBus-macOS-ARM64-Standalone.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/SonoBusStreamer_artefacts/Release/VST3/SonoBus Streamer.vst3" "SonoBusStreamer-macOS-ARM64-VST3.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/SonoBusStreamer_artefacts/Release/Standalone/SonoBus Streamer.app" "SonoBusStreamer-macOS-ARM64-Standalone.zip"

      - name: Publish macOS assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: SonoBus 1.7.2 Patchbay Beta 5
          body: |
            SonoBus 1.7.2 Patchbay Beta 5

            - Adds SonoBus Streamer as a separate VST3 and Standalone product, compatible with SonoBus network streams.
            - The Stream to Outputs patchbay now lets you select the incoming participant stream explicitly and shows which stream is being patched.
            - Fixes patchbay routing from additional VST3 inputs when host input and output buses share process-buffer channels.
            - Lets you assign and save custom labels for interface inputs and outputs in the patchbay.
            - Full beta runs include Apple Silicon ARM64 macOS VST3 and Standalone builds; Windows-only runs skip macOS.
            - Windows x64 VST3 builds are attached after the Windows workflow finishes.
            - The iOS Streamer product is not included in this beta.
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            SonoBus-macOS-ARM64-VST3.zip
            SonoBus-macOS-ARM64-Standalone.zip
            SonoBusStreamer-macOS-ARM64-VST3.zip
            SonoBusStreamer-macOS-ARM64-Standalone.zip

  windows-vst3:
    needs: macos
    if: ${{ always() && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure x64 build
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DUniversalBinary=OFF

      - name: Build SonoBus VST3
        run: cmake --build build --config Release --target SonoBus_VST3 --parallel 4

      - name: Build SonoBus Streamer VST3
        run: cmake --build build --config Release --target SonoBusStreamer_VST3 --parallel 4

      - name: Package VST3 products
        shell: pwsh
        run: |
          Compress-Archive -Path "build/SonoBus_artefacts/Release/VST3/SonoBus.vst3" -DestinationPath "SonoBus-Windows-x64-VST3.zip" -Force
          Compress-Archive -Path "build/SonoBusStreamer_artefacts/Release/VST3/SonoBus Streamer.vst3" -DestinationPath "SonoBusStreamer-Windows-x64-VST3.zip" -Force

      - name: Publish Windows assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: SonoBus 1.7.2 Patchbay Beta 5
          body: |
            SonoBus 1.7.2 Patchbay Beta 5

            - Fixes patchbay routing from additional VST3 inputs when host input and output buses share process-buffer channels.
            - Lets you assign and save custom labels for interface inputs and outputs in the patchbay.
            - Includes Windows x64 VST3 builds for SonoBus and SonoBus Streamer.
            - This Windows-only build skips macOS products; the prior beta remains available for macOS.
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            SonoBus-Windows-x64-VST3.zip
            SonoBusStreamer-Windows-x64-VST3.zip
